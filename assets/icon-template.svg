<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="512" cy="512" r="512" fill="#f97316"/>
  
  <!-- Gradient Background -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ea580c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <circle cx="512" cy="512" r="512" fill="url(#grad1)"/>
  
  <!-- Shopping Bag Icon -->
  <g transform="translate(512, 512)">
    <!-- Bag Body -->
    <path d="M -120 -200 L -120 200 L 120 200 L 120 -200 Z" 
          fill="white" 
          stroke="white" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Bag Handle -->
    <path d="M -100 -200 Q -100 -280 0 -280 Q 100 -280 100 -200" 
          fill="none" 
          stroke="white" 
          stroke-width="30" 
          stroke-linecap="round"/>
    
    <!-- Shopping Cart (small, bottom right) -->
    <g transform="translate(200, 150) scale(0.6)">
      <circle cx="0" cy="80" r="40" fill="white" opacity="0.9"/>
      <circle cx="120" cy="80" r="40" fill="white" opacity="0.9"/>
      <rect x="-60" y="-20" width="200" height="60" rx="10" fill="white" opacity="0.9"/>
      <rect x="20" y="-80" width="80" height="20" rx="5" fill="white" opacity="0.9"/>
    </g>
    
    <!-- Package (small, bottom left) -->
    <g transform="translate(-200, 150) scale(0.6)">
      <rect x="-60" y="-60" width="120" height="120" rx="10" fill="white" opacity="0.9"/>
      <line x1="0" y1="-60" x2="0" y2="60" stroke="#f97316" stroke-width="8"/>
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#f97316" stroke-width="8"/>
    </g>
  </g>
</svg>
